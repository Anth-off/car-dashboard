name: Android test release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: write

concurrency:
  group: android-test-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build, test and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Prepare downloads
        run: |
          mkdir release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/cockpit-${RELEASE_TAG#v}-debug.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab "release-artifacts/cockpit-${RELEASE_TAG#v}-debug.aab"
          git archive --format=zip --prefix=cockpit/ --output=release-artifacts/cockpit-sources.zip HEAD
          cd release-artifacts
          sha256sum *.apk *.aab *.zip > SHA256SUMS.txt
      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Cockpit : une carte plus grande et une navigation enrichie.

          - Carte prioritaire dans le dashboard, mode plein écran sur téléphone, déplacement au doigt, zoom/pincement, recentrage, orientation et vue d’ensemble.
          - Carte jour/nuit, destination visible, itinéraire parcouru atténué, échelle et précision GPS.
          - Heure d’arrivée estimée hors trafic, prochaine manœuvre et suivante, liste des étapes, commande vocale directe, recalcul automatique après sortie confirmée.
          - Recherche d’adresses améliorée, favoris et 12 destinations récentes locales.
          - Android Auto : carte manipulable et options de guidage adaptées aux modèles du véhicule.

          APK et AAB de débogage compilés après les tests JVM/Robolectric et Android Lint. Les essais sur autoradio et avec une session Apple Music réelle restent à effectuer.

          L’APK permet les essais sur téléphone. Pour Android Auto, utiliser un canal de test Google Play compatible avec la Car App Library ; une installation directe ne suffit pas.

          La signature de débogage CI peut différer des APK précédents : une réinstallation peut être nécessaire et efface alors les données locales. Ces fichiers sont réservés aux essais, sans trafic en direct ni garantie des services publics de navigation.
          EOF
          release_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$release_state" == false ]]; then
            echo "This release is already published; choose a new tag."
            exit 1
          fi
          if [[ "$release_state" != true ]]; then
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --title "Cockpit ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --target "$GITHUB_SHA" --title "Cockpit ${RELEASE_TAG#v}" --notes-file release-notes.md
