name: Android signed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        required: true
        default: v0.4.0
        type: string

permissions:
  contents: write

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.version }}
      COCKPIT_SIGNING_STORE_PASSWORD: ${{ secrets.COCKPIT_SIGNING_STORE_PASSWORD }}
      COCKPIT_SIGNING_KEY_ALIAS: ${{ secrets.COCKPIT_SIGNING_KEY_ALIAS }}
      COCKPIT_SIGNING_KEY_PASSWORD: ${{ secrets.COCKPIT_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore and verify persistent signing key
        env:
          COCKPIT_SIGNING_KEYSTORE_BASE64: ${{ secrets.COCKPIT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          export COCKPIT_SIGNING_STORE_FILE="$RUNNER_TEMP/cockpit-signing.keystore"
          printf 'COCKPIT_SIGNING_STORE_FILE=%s\n' "$COCKPIT_SIGNING_STORE_FILE" >> "$GITHUB_ENV"
          for name in COCKPIT_SIGNING_KEYSTORE_BASE64 COCKPIT_SIGNING_STORE_PASSWORD COCKPIT_SIGNING_KEY_ALIAS COCKPIT_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing persistent signing secret: $name. See docs/SIGNING.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$COCKPIT_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$COCKPIT_SIGNING_STORE_FILE"
          python3 scripts/verify-release-signature.py --keystore "$COCKPIT_SIGNING_STORE_FILE"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed artifacts, test and lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest :app:lintRelease
      - name: Verify artifact signatures and version
        run: |
          python3 scripts/verify-release-signature.py --apk app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify-release-signature.py --bundle app/build/outputs/bundle/release/app-release.aab
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("app/build/outputs/apk/release/output-metadata.json").read_text())
          outputs = metadata["elements"]
          if metadata["applicationId"] != "fr.cockpit.gps" or len(outputs) != 1:
              raise SystemExit("Unexpected application identity or APK outputs")
          if f'v{outputs[0]["versionName"]}' != os.environ["RELEASE_TAG"]:
              raise SystemExit("Release tag differs from the compiled application version")
          if outputs[0]["versionCode"] <= 2:
              raise SystemExit("The versionCode must increase beyond the published 0.2.0 build")
          PY
      - name: Prepare downloads
        run: |
          mkdir release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/cockpit-${RELEASE_TAG#v}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/cockpit-${RELEASE_TAG#v}.aab"
          git archive --format=zip --prefix=cockpit/ --output=release-artifacts/cockpit-sources.zip HEAD
          cd release-artifacts
          sha256sum *.apk *.aab *.zip > SHA256SUMS.txt
      - name: Publish signed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Cockpit GPS affiche désormais le même composant de tableau de bord sur le téléphone et Android Auto : carte, vitesse, météo, compteurs et commandes Apple Music réunis dans un écran fixe.

          Le dashboard s’ouvre directement sur les hôtes Car App API 5 ou plus. Les clics, le zoom et le déplacement de carte sont reliés à la vue partagée. La barre système et certains menus restent contrôlés par Android Auto. Le bouton « Carte seule » conserve le rendu de navigation classique ; les anciens hôtes gardent leur interface compatible.

          **Mise à jour de Cockpit GPS 0.3 sans désinstallation :** même package `fr.cockpit.gps`, même certificat de signature, versionCode augmenté. Les compteurs, favoris et autorisations de Cockpit GPS sont conservés par la mise à jour. Installer le nouvel APK par-dessus la 0.3, avec KingInstaller si cette méthode est nécessaire sur votre téléphone. Sa compatibilité dépend du téléphone et d’Android Auto ; elle a été confirmée par l’utilisateur pour la 0.3 sur S23, pas encore pour cette version.

          L’ancienne application Cockpit 0.2 (`fr.cockpit.dashboard`) reste indépendante ; ses données ne sont pas importées. Ne pas la désinstaller pour installer cette version.

          APK et AAB release signés et vérifiés. Tests JVM/Robolectric, rendu de la Presentation, clics et cycle de vie vérifiés avant publication. Les essais de cette version sur autoradio physique et avec Apple Music réel restent à effectuer. Les itinéraires restent sans trafic en direct.

          Version de test privée : ce dashboard complet sur la surface de navigation n’est pas qualifié pour une distribution Google Play. La publication GitHub ne constitue pas une validation Android Auto par Google.
          EOF
          release_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$release_state" == false ]]; then
            echo "This release is already published; choose a new tag."
            exit 1
          fi
          if [[ "$release_state" != true ]]; then
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --title "Cockpit GPS ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --target "$GITHUB_SHA" --title "Cockpit GPS ${RELEASE_TAG#v}" --notes-file release-notes.md
      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cockpit-signing.keystore"
