name: Publish prepared Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        required: true
        default: v0.4.1
        type: string
      artifact_commit:
        description: Exact commit containing already signed public APK, AAB and source ZIP
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.version }}
      ARTIFACT_COMMIT: ${{ inputs.artifact_commit }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARTIFACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Check out public signed artifacts
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.artifact_commit }}
          path: prepared
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install artifact verification tools
        run: |
          sdkmanager "build-tools;35.0.0"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          printf '378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  %s\n' "$RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
      - name: Verify source, successful checks, versions, checksums and signing certificates
        run: |
          python3 source/scripts/verify-prepared-release.py \
            --source source --artifacts prepared --version "$RELEASE_TAG" \
            --repository "$GH_REPO" --bundletool "$RUNNER_TEMP/bundletool.jar"
      - name: Prepare draft release
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Cockpit GPS 0.4.1 réduit les annonces vocales du GPS, corrige la reconnexion musicale et clarifie les indications de suivi après une mise à jour.

          Le guidage vocal annonce les manœuvres utiles à la préparation puis à l’action, au lieu de quatre rappels successifs. Les simples changements de nom de route et le maintien tout droit restent visuels. Une instruction normale ne coupe plus la phrase en cours ; les annonces en attente devenues obsolètes sont abandonnées.

          Quand Android déconnecte le service musical, Cockpit demande sa reconnexion uniquement si l’accès aux notifications est toujours accordé. Les commandes retrouvent la session Apple Music sans demander de retirer puis réactiver cet accès. Une session Apple Music doit toujours être disponible.

          Quand le suivi GPS est déjà lancé mais n’a pas encore reçu de position, la carte affiche la recherche du signal au lieu de demander d’activer le GPS. La météo attend elle aussi une position récente. Après une mise à jour, ouvrir Cockpit et démarrer le suivi si nécessaire ; cela ne demande pas de réaccorder une localisation déjà autorisée.

          Un refus des notifications de trajet n’est plus redemandé à chaque démarrage du suivi. Android reste la source de vérité pour les accès : le correctif ne peut pas accorder une permission refusée ou retirée.

          **Mise à jour sans désinstallation depuis Cockpit GPS 0.3 ou 0.4 :** même package `fr.cockpit.gps`, même certificat et versionCode augmenté. Installer `cockpit-0.4.1.apk` par-dessus l’application avec la même méthode KingInstaller. Compteurs et favoris conservés. L’ancien Cockpit 0.2 reste indépendant.

          Le dashboard partagé téléphone/Android Auto de la 0.4 est conservé. Tests logiciels et signatures vérifiés avant publication ; la reprise sur le S23 et l’autoradio réels reste à confirmer. Version de test privée sur GitHub, sans qualification Google Play et sans trafic routier en direct.
          EOF
          release_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$release_state" == false ]]; then
            echo "::error::This release is already published; choose a new version."
            exit 1
          fi
          if [[ "$release_state" != true ]]; then
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Cockpit GPS ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release edit "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Cockpit GPS ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "prepared/cockpit-${RELEASE_TAG#v}.apk" "prepared/cockpit-${RELEASE_TAG#v}.aab" \
            prepared/cockpit-sources.zip prepared/SHA256SUMS.txt
      - name: Verify uploaded asset digests before publication
        run: |
          python3 source/scripts/verify-prepared-release.py \
            --source source --artifacts prepared --version "$RELEASE_TAG" \
            --repository "$GH_REPO" --bundletool "$RUNNER_TEMP/bundletool.jar" --verify-uploaded
      - name: Publish verified prerelease
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --target "$GITHUB_SHA" \
            --title "Cockpit GPS ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
