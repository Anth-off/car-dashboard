name: Publish prepared Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        required: true
        default: v0.4.0
        type: string
      artifact_commit:
        description: Exact commit containing already signed public APK, AAB and source ZIP
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.version }}
      ARTIFACT_COMMIT: ${{ inputs.artifact_commit }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARTIFACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Check out public signed artifacts
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.artifact_commit }}
          path: prepared
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install artifact verification tools
        run: |
          sdkmanager "build-tools;35.0.0"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          printf '378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  %s\n' "$RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
      - name: Verify source, successful checks, versions, checksums and signing certificates
        run: |
          python3 source/scripts/verify-prepared-release.py \
            --source source --artifacts prepared --version "$RELEASE_TAG" \
            --repository "$GH_REPO" --bundletool "$RUNNER_TEMP/bundletool.jar"
      - name: Prepare draft release
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Cockpit GPS affiche désormais le même composant de tableau de bord sur le téléphone et Android Auto : carte, vitesse, météo, compteurs et commandes Apple Music réunis dans un écran fixe.

          Le dashboard s’ouvre directement sur les hôtes Car App API 5 ou plus. Les clics, le zoom et le déplacement de carte sont reliés à la vue partagée. La barre système et certains menus restent contrôlés par Android Auto. Le bouton « Carte seule » conserve le rendu de navigation classique ; les anciens hôtes gardent leur interface compatible.

          **Mise à jour de Cockpit GPS 0.3 sans désinstallation :** même package `fr.cockpit.gps`, même certificat de signature, versionCode augmenté. Les compteurs, favoris et autorisations de Cockpit GPS sont conservés par la mise à jour. Installer le nouvel APK par-dessus la 0.3, avec KingInstaller si cette méthode est nécessaire sur votre téléphone. Sa compatibilité dépend du téléphone et d’Android Auto ; elle a été confirmée par l’utilisateur pour la 0.3 sur S23, pas encore pour cette version.

          L’ancienne application Cockpit 0.2 (`fr.cockpit.dashboard`) reste indépendante ; ses données ne sont pas importées. Ne pas la désinstaller pour installer cette version.

          APK et AAB release signés et vérifiés. Tests JVM/Robolectric, rendu de la Presentation, clics et cycle de vie vérifiés avant publication. Les essais de cette version sur autoradio physique et avec Apple Music réel restent à effectuer. Les itinéraires restent sans trafic en direct.

          Version de test privée : ce dashboard complet sur la surface de navigation n’est pas qualifié pour une distribution Google Play. La publication GitHub ne constitue pas une validation Android Auto par Google.
          EOF
          release_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$release_state" == false ]]; then
            echo "::error::This release is already published; choose a new version."
            exit 1
          fi
          if [[ "$release_state" != true ]]; then
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Cockpit GPS ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release edit "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Cockpit GPS ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "prepared/cockpit-${RELEASE_TAG#v}.apk" "prepared/cockpit-${RELEASE_TAG#v}.aab" \
            prepared/cockpit-sources.zip prepared/SHA256SUMS.txt
      - name: Verify uploaded asset digests before publication
        run: |
          python3 source/scripts/verify-prepared-release.py \
            --source source --artifacts prepared --version "$RELEASE_TAG" \
            --repository "$GH_REPO" --bundletool "$RUNNER_TEMP/bundletool.jar" --verify-uploaded
      - name: Publish verified prerelease
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --target "$GITHUB_SHA" \
            --title "Cockpit GPS ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
